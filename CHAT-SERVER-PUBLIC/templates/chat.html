{% extends "base.html" %}
{% block title %}공용 채팅방{% endblock %}
{% block content %}
<section class="chat-card">
  <header class="chat-header">
    <div>
      <div class="brand small">CHAT<span>ROOM</span></div>
      <h1>공용 채팅방</h1>
      <p class="muted">로그인: {{ username }} · 최근 메시지 20개 보관</p>
    </div>
    <form method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="secondary" type="submit">로그아웃</button>
    </form>
  </header>
  <div id="status" class="status" role="status">메시지 불러오는 중…</div>
  <ol id="messages" class="messages" aria-live="polite"></ol>
  <form id="send-form" class="send-form">
    <input type="hidden" id="csrf-token" value="{{ csrf_token() }}">
    <div class="input-wrap">
      <input id="message-input" maxlength="25" placeholder="메시지를 입력해 (최대 25자)" autocomplete="off" required>
      <span id="counter">0/25</span>
    </div>
    <button id="send-button" type="submit">전송</button>
  </form>
  <p class="hint">오래된 메시지는 새 메시지가 올 때 데이터베이스에서도 삭제돼.</p>
</section>
<script src="{{ url_for('static', filename='chat.js') }}" defer></script>
{% endblock %}
