{% extends "base.html" %}
{% block title %}회원가입 · 공용 채팅{% endblock %}
{% block content %}
<section class="card">
  <div class="brand">CHAT<span>ROOM</span></div>
  <h1>계정 만들기</h1>
  <p class="muted">아이디 3~20자 · 비밀번호 8자 이상</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">아이디</label>
    <input id="username" name="username" minlength="3" maxlength="20" autocomplete="username" required>
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
    <button type="submit">회원가입</button>
  </form>
  <p class="switch">이미 계정이 있어? <a href="{{ url_for('login') }}">로그인</a></p>
</section>
{% endblock %}
