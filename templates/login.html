{% extends "base.html" %}
{% block title %}로그인 · 공용 채팅{% endblock %}
{% block content %}
<section class="card">
  <div class="brand">CHAT<span>ROOM</span></div>
  <h1>다시 만나서 반가워</h1>
  <p class="muted">로그인해서 공용 채팅에 참여해.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">아이디</label>
    <input id="username" name="username" maxlength="20" autocomplete="username" required>
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required>
    <button type="submit">로그인</button>
  </form>
  <p class="switch">처음 왔어? <a href="{{ url_for('register') }}">회원가입</a></p>
</section>
{% endblock %}
